[tool.poetry]
name = "proteinspy"
version = "1.1.0"
description = "A CLI tool and Python library to analyse protein structures from .cif and .pdb files"
authors = ["AkhilTeja2209 <mvsakhilteja@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://akhilteja2209.github.io/Proteinspy/"
repository = "https://github.com/AkhilTeja2209/Proteinspy"
documentation = "https://akhilteja2209.github.io/Proteinspy/"
keywords = [
    "protein", "bioinformatics", "structural-biology",
    "pdb", "cif", "mmcif", "cryo-em", "x-ray", "nmr", "gemmi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

packages = [{ include = "proteinspy" }]

[tool.poetry.dependencies]
python  = "^3.9"
gemmi   = "^0.6.5"
rich    = "^13.0"
click   = "^8.1"

[tool.poetry.extras]
advanced = ["biopython", "prody"]
viz      = ["matplotlib", "plotly"]

[tool.poetry.group.dev.dependencies]
pytest          = "^7.4"
pytest-cov      = "^4.1"
black           = "^24.0"
pylint          = "^3.0"
mypy            = "^1.0"
mkdocs          = "^1.6"
mkdocs-material = "^9.5"

[tool.poetry.scripts]
proteinspy = "proteinspy.cli.main:main"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --cov=proteinspy --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
branch = true
source = ["proteinspy"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length    = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
strict         = false
ignore_missing_imports = true

[tool.pylint.main]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "broad-except",
]
